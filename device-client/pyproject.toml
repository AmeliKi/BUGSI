[project]
name = "bugsi-device-client"
version = "0.1.0"
description = "BUGSI Device Client - daemon for Raspberry Pi insect detection devices"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "aiosqlite>=0.20.0",
    "cryptography>=44.0.0",
    "aiohttp>=3.9.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "aiomqtt>=2.0.0",
    "astral>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
bugsi = "bugsi_daemon.main:main"

[tool.setuptools.packages.find]
include = ["bugsi_daemon*"]

[tool.setuptools.package-data]
"bugsi_daemon.web" = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
