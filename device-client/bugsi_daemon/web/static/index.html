<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUGSI Device</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>BUGSI Device</h1>
    <nav>
      <button class="tab active" data-tab="camera">Camera</button>
      <button class="tab" data-tab="gallery">Gallery</button>
      <button class="tab" data-tab="config">Config</button>
      <button class="tab" data-tab="status">Status</button>
      <button class="tab" data-tab="logs">Logs</button>
    </nav>
  </header>

  <main>
    <section id="camera" class="panel active">
      <h2>Live Camera</h2>
      <div class="camera-dual">
        <div class="camera-panel" id="still-camera-panel">
          <h3 id="still-camera-label">Still Camera</h3>
          <div class="camera-controls">
            <button id="btn-still-stream">Start Stream</button>
            <button id="btn-still-snapshot">Snapshot</button>
            <span class="fps-display" id="still-fps"></span>
          </div>
          <div class="camera-view">
            <img id="still-camera-img" alt="Still camera feed">
          </div>
        </div>
        <div class="camera-panel" id="event-camera-panel" style="display:none;">
          <h3 id="event-camera-label">Event Camera</h3>
          <div class="camera-controls">
            <button id="btn-event-stream">Start Stream</button>
            <button id="btn-event-snapshot">Snapshot</button>
            <span class="fps-display" id="event-fps"></span>
          </div>
          <div class="camera-view">
            <img id="event-camera-img" alt="Event camera feed">
          </div>
        </div>
      </div>
    </section>

    <section id="gallery" class="panel">
      <h2>Detection Gallery</h2>
      <div id="gallery-grid" class="gallery-grid"></div>
      <button id="btn-load-more">Load More</button>
    </section>

    <section id="config" class="panel">
      <h2>Configuration</h2>
      <div class="config-info">
        <span>Version: <strong id="config-version">-</strong></span>
      </div>
      <div class="config-section" id="saas-connection-section">
        <button class="config-section-header" id="saas-section-toggle">SaaS Connection</button>
        <div class="config-section-body" id="saas-section-body">
          <div class="config-field">
            <label title="Full backend URL including path (e.g. http://host:port/api/device-data)">Server URL</label>
            <input type="text" id="saas-url" placeholder="http://host:port/api/device-data" style="width: 280px;">
          </div>
          <div class="config-field">
            <label>API Key</label>
            <input type="text" id="saas-api-key" placeholder="Leave blank to keep current key">
          </div>
          <div class="config-field" style="justify-content: flex-end; border-bottom: none;">
            <span id="saas-status" class="status-msg" style="margin-right: auto; margin-top: 0; padding: 0;"></span>
            <button id="btn-save-saas" class="btn-secondary">Save Connection</button>
          </div>
        </div>
      </div>
      <div class="config-view-toggle">
        <button id="btn-view-form" class="view-toggle active" data-view="form">Form</button>
        <button id="btn-view-json" class="view-toggle" data-view="json">JSON</button>
      </div>
      <div id="config-form"></div>
      <div id="config-json-view" style="display:none;">
        <textarea id="config-editor" rows="20"></textarea>
      </div>
      <div class="config-actions">
        <button id="btn-save-config">Save &amp; Push to SaaS</button>
        <button id="btn-pull-config" class="btn-secondary">Pull from SaaS</button>
        <button id="btn-reload-config" class="btn-secondary">Reload Local</button>
      </div>
      <div id="config-status" class="status-msg"></div>
    </section>

    <section id="status" class="panel">
      <h2>Device Status</h2>
      <pre id="status-output">Loading...</pre>
      <button id="btn-refresh-status">Refresh</button>
    </section>

    <section id="logs" class="panel">
      <h2>Debug Logs</h2>
      <div class="log-controls">
        <select id="log-level-filter">
          <option value="">All Levels</option>
          <option value="ERROR">ERROR</option>
          <option value="WARNING">WARNING</option>
          <option value="INFO">INFO</option>
          <option value="DEBUG">DEBUG</option>
        </select>
        <button id="btn-refresh-logs">Refresh</button>
        <label><input type="checkbox" id="log-auto-refresh"> Auto-refresh (5s)</label>
      </div>
      <pre id="log-output">Loading...</pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
